name: AdSense Code Quality

on:
  push:
    branches:
      - feat/blog-monetization-os
    paths:
      - "src/config/adsense.ts"
      - "src/lib/adsense.ts"
      - "src/components/ads/**"
      - "src/App.tsx"
      - "src/vite-env.d.ts"
      - "scripts/adsense-daily-report.mjs"
      - ".github/workflows/adsense-*.yml"
      - "package*.json"
  pull_request:
    paths:
      - "src/config/adsense.ts"
      - "src/lib/adsense.ts"
      - "src/components/ads/**"
      - "src/App.tsx"
      - "src/vite-env.d.ts"
      - "scripts/adsense-daily-report.mjs"
      - ".github/workflows/adsense-*.yml"
      - "package*.json"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
