name: AdSense Code Quality

on:
  push:
    branches:
      - feat/blog-monetization-os
    paths:
      - "index.html"
      - "src/config/adsense.ts"
      - "src/lib/adsense.ts"
      - "src/lib/googleConsent.ts"
      - "src/components/CookieConsent.tsx"
      - "src/components/ads/**"
      - "src/App.tsx"
      - "src/vite-env.d.ts"
      - "scripts/adsense-*.mjs"
      - ".github/workflows/adsense-*.yml"
      - "package*.json"
  pull_request:
    paths:
      - "index.html"
      - "src/config/adsense.ts"
      - "src/lib/adsense.ts"
      - "src/lib/googleConsent.ts"
      - "src/components/CookieConsent.tsx"
      - "src/components/ads/**"
      - "src/App.tsx"
      - "src/vite-env.d.ts"
      - "scripts/adsense-*.mjs"
      - ".github/workflows/adsense-*.yml"
      - "package*.json"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The existing Lovable project has dependency constraints that make
      # strict npm ci fail before compilation. Install with legacy peer
      # resolution so CI can validate the actual application build/tests.
      - name: Install
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: AdSense readiness audit
        run: npm run ads:audit

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
